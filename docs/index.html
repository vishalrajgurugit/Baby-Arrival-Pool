<!doctype html><html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mahuvagara Baby Arrival Pool 2027 · Demo</title><style>:root{color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:#070e1c;color:#edf4ff;font:16px/1.5 system-ui,sans-serif}h1,h2{font-family:Georgia,serif;font-weight:normal;line-height:1.08;margin:0 0 .6rem}h1{font-size:clamp(2.75rem,7vw,5rem);letter-spacing:-.06em}h2{font-size:2rem;letter-spacing:-.035em}p{margin:.4rem 0 1rem}a{color:#9bc7ff}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #9bc7ff;outline-offset:3px}.shell{width:min(1150px,100%);margin:auto;padding:0 24px 48px}.top{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.87rem;font-weight:700}.brand{display:flex;align-items:center;gap:.6rem}.brand-mark{display:grid;place-items:center;background:#132c50;color:#c5dfff;border-radius:50%;width:34px;height:34px;font-size:1.1rem}.badge{display:inline-flex;border:1px solid #35577c;background:#10243e;border-radius:99px;padding:6px 12px;color:#c8e1ff;font-size:.75rem;font-weight:750;white-space:nowrap}.hero{position:relative;overflow:hidden;background:radial-gradient(ellipse at 88% 16%,#152b48 0,transparent 47%),linear-gradient(120deg,#0d1d35,#102641);border:1px solid #294869;border-radius:28px;padding:clamp(24px,5vw,55px);margin-bottom:24px}.hero-copy{position:relative;z-index:1}.hero p{color:#c6d8ef;max-width:35rem}.year{display:block;color:#91c2ff}.cloud{position:absolute;right:9%;top:13%;font-size:clamp(48px,14vw,160px);line-height:1;color:#3b587e;transform:rotate(-13deg);text-shadow:0 14px 36px #00000035;user-select:none}.spark{position:absolute;color:#86b8f0;right:10%;bottom:18%;font-size:2.5rem}.workspace{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(245px,1fr);gap:20px;align-items:start}.card{background:#0d192b;border:1px solid #293e59;border-radius:22px;padding:22px;box-shadow:0 6px 24px #00000025}.muted{color:#b2c5df;font-size:.9rem}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;color:#b2c5df;font-size:.75rem;font-weight:700;padding-bottom:6px}.day{min-width:0;border:1px solid #304a68;border-radius:12px;padding:5px;background:#101f34}.day.due{background:#3d3020;border-color:#bf9659}.day-number{font-size:.86rem;font-weight:800;display:flex;justify-content:space-between;padding:0 2px 4px}.due-symbol{color:#f3c580}.slots{display:flex;gap:3px}.slot{border:0;border-radius:6px;background:#183557;color:#d5e8ff;flex:1;min-width:0;min-height:34px;padding:0;font-size:.69rem;font-weight:800}.slot.pm{background:#163e4c;color:#cef3fa}.slot[aria-pressed=true]{background:#8abfff;color:#071426}.legend{margin:.8rem 0 0;color:#b2c5df;font-size:.8rem}.selection{display:block;background:#153253;color:#d4e8ff;padding:10px 12px;border-radius:10px;margin-bottom:12px;font-weight:700;font-size:.9rem}.field{display:block;margin:10px 0;font-weight:700;font-size:.86rem}.field input,.field textarea{display:block;width:100%;border:1px solid #52749c;border-radius:9px;padding:9px;margin-top:4px;background:#0d192b;color:#edf4ff;font-weight:400}.action{border:0;border-radius:10px;background:#8abfff;color:#071426;padding:10px 15px;font-weight:750}.action.secondary{background:#183557;color:#d5e8ff}.wide{width:100%}.error{color:#ffa7bc}.receipt{overflow-wrap:anywhere}.admin-table{overflow:auto;margin:16px 0}table{border-collapse:collapse;width:100%;font-size:.87rem}th,td{text-align:left;vertical-align:top;padding:8px;border-bottom:1px solid #293e59;overflow-wrap:anywhere}th{white-space:nowrap}#admin{max-width:1050px;margin:auto;padding:20px}#admin h1{font-size:clamp(2rem,6vw,3.5rem)}.admin-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}@media(max-width:850px){.workspace{grid-template-columns:1fr}.slots{flex-direction:column}.slot{min-height:42px}.cloud{right:5%;top:12%}}@media(max-width:480px){.shell{padding:0 9px 24px}.card{padding:12px}.calendar{gap:3px}.day{padding:3px}.hero{border-radius:20px}.cloud{right:5%;top:12%;opacity:.55}}

/* Prevent intrinsic content from widening the page; keep form controls readable. */
.workspace > *, .brand {min-width:0}
.brand-mark {flex-shrink:0}
.top {flex-wrap:wrap;padding-block:12px}
.field input,.field textarea {min-width:0;font-size:1rem;min-height:44px}
.action {min-height:44px}
.day-weekday {display:none}
#prediction > .secondary {margin-bottom:12px}
@media (max-width:600px) {
  .shell {padding:0 12px 28px}
  .hero {padding:24px;margin-bottom:16px}
  .hero h1 {font-size:clamp(2.25rem,9vw,3.25rem)}
  .hero .badge {white-space:normal}
  .workspace {gap:16px}
  .card {padding:16px}
  .calendar {grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .weekday,.calendar-spacer {display:none}
  .day {padding:6px;border-radius:10px}
  .day-number {align-items:center;flex-wrap:wrap;gap:3px;font-size:1rem;padding-bottom:6px}
  .day-weekday {display:inline;font-size:.75rem;font-weight:500;color:#b2c5df}
  .slots {gap:5px}
  .slot {min-height:44px;font-size:.875rem;flex:none;width:100%}
  .legend {font-size:.875rem}
}

.field input,.field textarea {background:#091425;caret-color:#8abfff}
.field input::placeholder,.field textarea::placeholder {color:#a5bad4;opacity:1}
@media (hover:hover) {
  .slot:not(:disabled):hover,.action:not(:disabled):hover {filter:brightness(1.15)}
}

/* A quiet night-sky welcome, with illustration kept clear of the copy. */
.hero {display:grid;grid-template-columns:minmax(0,1.65fr) minmax(230px,1fr);align-items:center;gap:24px;background:radial-gradient(ellipse at 92% 15%,#163555 0,transparent 60%),linear-gradient(135deg,#0c192e,#081424);border-color:#2b496c}
.hero-copy {min-width:0}
.hero h1 {font-size:clamp(2.25rem,4.7vw,3.8rem);letter-spacing:-.045em;line-height:1.1}
.hero .year {font-size:.68em;margin-top:12px;color:#91c2ff;letter-spacing:.02em}
.hero .hero-eyebrow {color:#b6d6ff;text-transform:uppercase;letter-spacing:.16em;font-size:.7rem;font-weight:750;margin:0 0 18px}
.hero .badge {gap:8px;align-items:center;background:#12273e;border-color:#406181;color:#d8e9ff}
.hero-art {width:100%;max-width:340px;justify-self:center;text-align:center}
.hero-art svg {display:block;width:100%;height:auto}
.art-caption {display:block;color:#b2c5df;font-size:.75rem;letter-spacing:.06em;margin-top:6px}
@media(max-width:700px) {
  .hero {grid-template-columns:minmax(0,1fr);gap:14px;padding:24px}
  .hero h1 {font-size:clamp(2.05rem,8vw,3rem)}
  .hero-art {max-width:230px}
  .hero .hero-eyebrow {font-size:.65rem;letter-spacing:.12em}
}

.shell {padding-top:24px}
.hero .hero-subtitle {font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.2rem,2.2vw,1.45rem);font-style:italic;line-height:1.55;color:#d7e7fa;margin:20px 0 8px;text-wrap:pretty}
.hero .hero-instructions {font-size:.95rem;line-height:1.6;color:#b2c5df;margin:0 0 20px}
@media(max-width:600px) {.shell {padding-top:12px}}
</style></head><body><main id="pool" data-mode="demo" aria-busy="true"></main><script type="module">const root = document.querySelector('#pool');
const demo = root.dataset.mode === 'demo';
const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let selected;
let requestId;
let sampleNumber = 0;
let closed = false;
let giftEnabled = false;
const banner = '';
const hero = '<section class="hero"><div class="hero-copy"><p class="hero-eyebrow">A little star is on his way</p><h1>Mahuvagara Baby Arrival Pool</h1><p class="hero-subtitle">Guess when our newest family member will arrive.</p><p class="hero-instructions">Pick a January date and choose AM or PM.</p><span class="badge"><span aria-hidden="true">✦</span> Expected January 21, 2027</span></div><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 360 360" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="moon-glow" x1="100" y1="30" x2="260" y2="220" gradientUnits="userSpaceOnUse"><stop stop-color="#fff0bd"/><stop offset="1" stop-color="#e5bd75"/></linearGradient><linearGradient id="blanket" x1="120" y1="230" x2="240" y2="310" gradientUnits="userSpaceOnUse"><stop stop-color="#80baff"/><stop offset="1" stop-color="#376caf"/></linearGradient></defs><circle cx="180" cy="167" r="142" stroke="#294a70" stroke-dasharray="3 9"/><circle cx="180" cy="167" r="116" fill="#132b49" fill-opacity=".55"/><path d="M210 48a83 83 0 1 0 62 131A74 74 0 0 1 210 48Z" fill="url(#moon-glow)"/><path d="M180 194v31M128 192v45M232 192v45" stroke="#7e9bbc" stroke-width="2"/><path d="M116 192q64-27 128 0" stroke="#a8c7eb" stroke-width="3" stroke-linecap="round"/><path d="m128 230 4 9 10 1-8 7 2 10-8-5-9 5 2-10-8-7 10-1Z" fill="#efd193"/><path d="m232 230 4 9 10 1-8 7 2 10-8-5-9 5 2-10-8-7 10-1Z" fill="#efd193"/><circle cx="180" cy="246" r="21" fill="#f1d3b9"/><path d="M158 246a22 22 0 0 1 44 0q-23-12-44 0" fill="#a8d1ff"/><path d="M168 249q4 4 8 0m8 0q4 4 8 0" stroke="#725846" stroke-width="2" stroke-linecap="round"/><path d="M147 267q33-19 66 0l-8 28h-50Z" fill="url(#blanket)"/><path d="m164 266 33 27m-42-13 23 16" stroke="#b7d9ff" stroke-width="2" opacity=".6"/><path d="M129 283h102q-6 31-51 31t-51-31Z" fill="#213f63" stroke="#7b9fc8" stroke-width="2"/><path d="M147 311l-8 12m74-12 8 12m-87 3q46 15 92 0" stroke="#7b9fc8" stroke-width="3" stroke-linecap="round"/><path d="M59 269c-13-22-43-10-40 10-19 2-19 28 3 28h66c25 0 27-30 5-33-6-19-29-19-34-5Zm236-65c-12-19-36-8-34 9-17 2-17 23 2 23h55c22 0 23-25 4-28-5-16-24-16-27-4Z" fill="#244468"/><g fill="#b9d8ff"><path d="m78 83 3 10 10 3-10 3-3 10-3-10-10-3 10-3Zm208 38 3 10 10 3-10 3-3 10-3-10-10-3 10-3Zm-34-96 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/><circle cx="103" cy="38" r="2"/><circle cx="310" cy="174" r="3"/><circle cx="57" cy="184" r="2"/><circle cx="280" cy="284" r="2"/></g></svg><span class="art-caption">One tiny arrival. So much love.</span></div></section>';

function invitationToken(hash) {
  const match = hash.match(/(?:^#|&)invite=([^&]*)/);
  if (!match) return null;
  try { return decodeURIComponent(match[1]); }
  catch { throw new Error('This invitation link is not encoded correctly. Ask the organizer for a new link.'); }
}

async function api(action, body) {
  const response = await fetch('/api/pool/' + action, body === undefined ? {} : {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body),
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || 'Please try again.');
  return data;
}

function calendar() {
  const cells = days.map(day => '<div class="weekday">' + day + '</div>');
  for (let i=0; i<5; i++) cells.push('<div class="calendar-spacer" aria-hidden="true"></div>');
  for (let day=1; day<=31; day++) {
    const due = day === 21;
    const buttons = ['AM','PM'].map(period =>
      '<button class="slot ' + period.toLowerCase() + '" type="button" data-day="' + day +
      '" data-period="' + period + '" aria-label="January ' + day + ' ' + period +
      '" aria-pressed="false"' + (closed ? ' disabled' : '') + '>' + period + '</button>').join('');
    cells.push('<div class="day' + (due?' due':'') + '"><div class="day-number">' + day +
      '<span class="day-weekday">' + days[(day + 4) % 7] + '</span>' +
      (due?'<span class="due-symbol" aria-label="Expected due date">✦</span>':'') +
      '</div><div class="slots">' + buttons + '</div></div>');
  }
  return cells.join('');
}

function render() {
  root.innerHTML = '<div class="shell">' + banner + hero +
    '<div class="workspace"><section class="card" aria-labelledby="month"><h2 id="month">January 2027</h2>' +
    '<p class="muted">Toronto time · AM before noon · PM from noon</p><div class="calendar">' +
    calendar() + '</div><p class="legend">✦ Expected due date. Any number of people can pick the same slot.</p></section>' +
    '<section class="card"><h2>Make a prediction</h2><p class="muted">$5 CAD per prediction when gift collection is open. All gifts go to the baby. There are no monetary prizes.</p>' +
    '<p class="muted" id="gift-status"></p><form id="prediction"><span class="selection" id="selection" role="status">Choose a date and time</span>' +
    '<label class="field">Your name<input name="name" maxlength="100" placeholder="Alex Taylor" autocomplete="name" required></label>' +
    '<label class="field">Email address<input name="email" type="email" maxlength="254" placeholder="alex@example.com" autocomplete="email" required></label>' +
    '<label class="field">Wishes for the baby <span class="muted">(optional)</span><textarea name="wishes" rows="3" maxlength="1000" placeholder="A little note for the family"></textarea></label>' +
    '<button class="action wide" id="submit" disabled>Save prediction</button><p class="error" role="alert" id="form-error"></p></form>' +
    '<div id="receipt" class="receipt" tabindex="-1" role="status" hidden></div></section></div></div>';
  const form = root.querySelector('form');
  const submit = root.querySelector('#submit');
  const error = root.querySelector('#form-error');
  const receipt = root.querySelector('#receipt');
  root.querySelector('#gift-status').textContent = closed ? 'Predictions are closed.' :
    giftEnabled ? 'Interac e-Transfer instructions appear after you save your prediction.' :
    demo ? 'Try a sample entry. Gift collection is off in the demo.' : 'Gift collection is currently off. You can still save a prediction.';
  form.hidden = closed;
  if (demo) {
    const sample = document.createElement('button');
    sample.type = 'button';
    sample.className = 'action secondary';
    sample.textContent = 'Use sample details';
    sample.addEventListener('click', () => {
      form.elements.name.value = 'Alex Taylor';
      form.elements.email.value = 'alex@example.com';
      form.elements.wishes.value = 'Wishing you a lifetime of love and laughter!';
    });
    form.insertBefore(sample,form.firstChild);
  }
  root.querySelector('.calendar').addEventListener('click', event => {
    const button = event.target.closest('.slot');
    if (!button || button.disabled || submit.dataset.busy) return;
    root.querySelector('[aria-pressed="true"]')?.setAttribute('aria-pressed','false');
    button.setAttribute('aria-pressed','true');
    selected = {day:Number(button.dataset.day),period:button.dataset.period};
    requestId = undefined;
    root.querySelector('#selection').textContent = 'January ' + selected.day + ' · ' + selected.period;
    receipt.hidden = true;
    error.textContent = '';
    submit.disabled = false;
  });
  form.addEventListener('input', () => { requestId = undefined; });
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (!selected || submit.dataset.busy) return;
    submit.dataset.busy = 'true';
    submit.disabled = true;
    const fields = [...form.querySelectorAll('input,textarea')];
    const data = Object.fromEntries(new FormData(form));
    fields.forEach(field => { field.readOnly = true; });
    error.textContent = '';
    try {
      if (!data.name.trim()) throw new Error('Enter your name.');
      const result = demo
        ? {reference:'DEMO-' + String(++sampleNumber).padStart(4,'0') + '-' + Math.random().toString(36).slice(2,8).toUpperCase()}
        : await api('submit', {...selected,...data,requestId:requestId ??= crypto.randomUUID()});
      const heading = document.createElement('h2');
      heading.textContent = demo ? 'Sample prediction saved' : 'Prediction saved';
      const slot = document.createElement('p');
      slot.textContent = 'January ' + selected.day + ' · ' + selected.period + ' (Toronto time)';
      const ref = document.createElement('p');
      ref.textContent = 'Confirmation reference: ' + result.reference;
      receipt.replaceChildren(heading,slot,ref);
      if (result.emailStatus === 'submitted' || result.emailStatus === 'unavailable') {
        const emailNote = document.createElement('p');
        emailNote.className = 'muted';
        emailNote.textContent = result.emailStatus === 'submitted'
          ? 'Your confirmation email has been submitted for delivery. Keep this reference too.'
          : 'Your prediction is saved, but we could not confirm an email was sent. Keep this reference and the instructions shown here.';
        receipt.append(emailNote);
      }
      if (result.transferEmail) {
        const instructions = document.createElement('p');
        instructions.append('Send $5 CAD by Interac e-Transfer to ');
        const email = document.createElement('a');
        email.href = 'mailto:' + result.transferEmail;
        email.textContent = result.transferEmail;
        instructions.append(email, '. Include your confirmation reference in the transfer message. The organizer will confirm receipt manually.');
        receipt.append(instructions);
      }
      const again = document.createElement('button');
      again.className = 'action secondary';
      again.textContent = 'Make another prediction';
      again.addEventListener('click', () => {
        receipt.hidden = true;
        form.hidden = false;
        form.elements.name.focus();
      });
      receipt.append(again);
      requestId = undefined;
      form.elements.wishes.value = '';
      form.hidden = true;
      receipt.hidden = false;
      receipt.focus();
    } catch (cause) {
      error.textContent = cause.message || 'Please try again.';
    } finally {
      fields.forEach(field => { field.readOnly = false; });
      delete submit.dataset.busy;
      submit.disabled = false;
    }
  });
}

async function start() {
  try {
    if (!demo) {
      const token = invitationToken(location.hash);
      if (token) {
        await api('invite',{token});
        history.replaceState(null,'',location.pathname + location.search);
      }
      const status = await api('status');
      closed = status.closed;
      giftEnabled = status.collection;
    }
    render();
  } catch (cause) {
    root.innerHTML = '<div class="shell">' + banner + hero + '<section class="card"><h2>Private invitation required</h2><p id="access-error"></p></section></div>';
    root.querySelector('#access-error').textContent = cause.message;
  } finally {
    root.removeAttribute('aria-busy');
  }
}
globalThis.addEventListener?.('hashchange', () => {
  if (!demo) location.reload();
});
start();
</script></body></html>
